services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-rate-limiter
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      RATE_LIMIT_WINDOW: 1s
      RATE_LIMIT_BLOCK_TIME: 5m
      RATE_LIMIT_IP: 3
      RATE_LIMIT_TOKEN: 3
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: go-rate-limiter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: